<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Cyber Snake</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#ecffff;font-family:Arial,sans-serif}.app{width:min(96vw,600px);margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.logo{color:#2ce5ed;letter-spacing:2px;font-size:24px}.top button{width:42px;height:42px;margin-left:5px;border:1px solid #38515a;border-radius:10px;background:#0c1820;color:#fff;font-size:20px}.hud{display:flex;justify-content:space-around;padding:10px;background:#0c171f;border:1px solid #223941;border-radius:12px;margin:8px 0}.board{height:min(76vh,700px);min-height:500px;border:3px solid #25dce5}.board canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.panel{position:fixed;z-index:5;right:0;top:0;width:min(390px,92vw);height:100dvh;background:#091218;border-left:1px solid #38515a;padding:55px 18px;overflow:auto;transform:translateX(110%);transition:.25s}.panel.open{transform:translateX(0)}.close{position:absolute;right:10px;top:8px;border:0;background:none;color:#fff;font-size:30px}.sec{border-top:1px solid #263b43}.sec>button{width:100%;padding:16px 0;background:none;border:0;color:#e9fcff;text-align:left;font-size:17px;font-weight:bold}.body{display:none;padding-bottom:12px}.sec.open .body{display:block}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{padding:9px;background:#101f27;border:1px solid #38515a;border-radius:9px;color:#fff}.item{display:grid;grid-template-columns:115px 1fr auto;align-items:center;gap:8px;border:1px solid #263b43;border-radius:10px;padding:7px;margin:7px 0}.prev{width:115px;height:68px;image-rendering:pixelated;background:#071018}.buy{padding:8px;border:0;border-radius:8px;background:#1bcbd7}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}.overlay.show{display:flex}.box{background:#0b171f;border:1px solid #45616a;border-radius:15px;padding:28px;text-align:center}.box button{padding:12px 25px;border:0;border-radius:9px;background:#1bcbd7;font-weight:bold}</style></head><body><div class="app"><div class="top"><h1 class="logo">CYBER SNAKE</h1><div><button id="sound">🔊</button><button id="restart">↻</button><button id="settings">⚙</button></div></div><div class="hud"><b>❤️ <span id="lives">3</span></b><b>🍎 <span id="score">0</span></b><b>🪙 <span id="coins">0</span></b><b>🏆 <span id="best">0</span></b></div><div class="board"><canvas id="game" width="540" height="760"></canvas></div></div><aside class="panel" id="panel"><button class="close" id="close">×</button><h2>Configurações</h2><div class="sec"><button>Loja</button><div class="body"><p>Moedas: 🪙 <b id="shopCoins">0</b></p><div id="shop"></div></div></div><div class="sec"><button>Missões</button><div class="body" id="missions"></div></div><div class="sec"><button>Cor da cobra</button><div class="body"><div class="choices" id="snakeColors"></div></div></div><div class="sec"><button>Cor do mapa</button><div class="body"><div class="choices" id="mapColors"></div></div></div><div class="sec"><button>Mapas</button><div class="body"><div class="choices" id="maps"></div></div></div></aside><div class="overlay" id="over"><div class="box"><h2>FIM DE JOGO</h2><p>Pontuação: <b id="final">0</b></p><button id="again">↻ REINICIAR</button></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),cell=27,W=20,H=28,$=id=>document.getElementById(id);let snake,apple,coin,obs,enemies,dir,next,score,lives,coins=+localStorage.csCoins||0,best=+localStorage.csBest||0,skin=localStorage.csSkin||'cyan',mapColor=localStorage.csMap||'cyan',map=localStorage.csMapType||'grade',owned=JSON.parse(localStorage.csOwned||'["cyan"]'),ownedMaps=JSON.parse(localStorage.csMaps||'["grade"]'),running,timer,soundOn=true,audio;const skins={cyan:['#eaffff','#18d7e4'],green:['#eaffea','#20d968'],blue:['#e5f3ff','#318cff'],gold:['#fff3a8','#e3b31c'],pink:['#ffe3ef','#ff3990'],purple:['#f0ddff','#a73eff'],red:['#ffd8d8','#f32f45'],orange:['#ffeed7','#ff7a12'],neon:['#eaffff','#00ff9d'],flame:['#fff0ad','#ff4000'],galaxy:['#ead8ff','#7545ff'],toxic:['#efffae','#83d600'],ice:['#fff','#63dcff'],shadow:['#d2d8dc','#1b2026'],dragonred:['#ffd0bb','#c8202c'],dragonblack:['#d7e0e5','#15191f'],boitata:['#fff0a0','#10a957'],dragonblue:['#d8efff','#216cff'],dragongold:['#fff4b2','#c78b12'],dragoncyber:['#d8ffff','#00a8c7']};const dragons=['dragonred','dragonblack','boitata','dragonblue','dragongold','dragoncyber'];const shopItems=[['neon','Neon',80],['flame','Chama',120],['galaxy','Galáxia',160],['toxic','Tóxica',200],['ice','Gelo',240],['shadow','Sombra',300],['dragonred','Dragão Vermelho',500],['dragonblack','Dragão Negro',650],['boitata','Boitatá',700],['dragonblue','Dragão Azul',800],['dragongold','Dragão Dourado',950],['dragoncyber','Dragão Cyber',1200]];const mapColors={cyan:'#20dce5',blue:'#318cff',green:'#20d968',purple:'#ad4cff',red:'#f32f45',orange:'#ff7a12',pink:'#ff3990',gold:'#e3b31c',ice:'#63dcff',dark:'#71858d'};const maps=[['grade','Grade',0],['circuito','Circuito',60],['matriz','Matriz',100],['deserto','Deserto',140],['espaco','Espaço',180],['lava','Lava',230],['oceano','Oceano',280],['cidade','Cidade Cyber',350]];function beep(f=600,d=.07){if(!soundOn)return;try{audio=audio||new AudioContext;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function occupied(p){return snake.some(s=>s.x==p.x&&s.y==p.y)||obs.some(o=>o.x==p.x&&o.y==p.y)||enemies.some(e=>e.x==p.x&&e.y==p.y)}function free(){let p;do{p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(occupied(p));return p}function reset(){snake=[{x:10,y:14},{x:9,y:14},{x:8,y:14}];dir=next={x:1,y:0};score=0;lives=3;obs=[];enemies=[];apple=free();coin=null;running=true;$('over').classList.remove('show');clearInterval(timer);timer=setInterval(tick,145);ui();draw()}function lose(){lives--;beep(160,.18);if(lives<=0){running=false;clearInterval(timer);$('final').textContent=score;$('over').classList.add('show');if(score>best){best=score;localStorage.csBest=best}}else{let n=snake.length,p=free();snake=Array.from({length:n},(_,i)=>({x:p.x-i,y:p.y}));dir=next={x:1,y:0}}ui();draw()}function tick(){if(!running)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=W||h.y<0||h.y>=H||snake.some(s=>s.x==h.x&&s.y==h.y)||obs.some(o=>o.x==h.x&&o.y==h.y)){lose();return}snake.unshift(h);if(h.x==apple.x&&h.y==apple.y){score++;beep(650);apple=free();if(!coin)coin=free();if(score%5==0){obs=[];for(let i=0;i<Math.min(12,Math.floor(score/5));i++)obs.push(free())}if(score>=10&&!enemies.length)enemies.push(free());if(score>best){best=score;localStorage.csBest=best}}else snake.pop();if(coin&&h.x==coin.x&&h.y==coin.y){coins++;localStorage.csCoins=coins;coin=null;beep(1000)}enemies.forEach(e=>{if(Math.random()<.75){let dx=h.x-e.x,dy=h.y-e.y;if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)}});if(enemies.some(e=>e.x==h.x&&e.y==h.y)){lose();return}ui();draw()}function ui(){$('lives').textContent=lives;$('score').textContent=score;$('coins').textContent=coins;$('best').textContent=best;$('shopCoins').textContent=coins}function draw(){document.querySelector('.board').style.borderColor=mapColors[mapColor];x.fillStyle=map=='deserto'?'#251b0c':map=='espaco'?'#07071a':map=='oceano'?'#061d2b':map=='lava'?'#291008':'#07151a';x.fillRect(0,0,c.width,c.height);x.strokeStyle=map=='matriz'?'#12391f':'#17363d';for(let i=1;i<W;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,c.height);x.stroke()}for(let j=1;j<H;j++){x.beginPath();x.moveTo(0,j*cell);x.lineTo(c.width,j*cell);x.stroke()}obs.forEach(o=>{x.fillStyle='#56666c';x.fillRect(o.x*cell+3,o.y*cell+3,21,21)});let ax=apple.x*cell+13,ay=apple.y*cell+13;x.fillStyle='#d62338';x.fillRect(ax-8,ay-7,16,15);x.fillStyle='#f04b55';x.fillRect(ax-6,ay-9,12,16);x.fillStyle='#59ad46';x.fillRect(ax+2,ay-14,6,6);if(coin){let qx=coin.x*cell+13,qy=coin.y*cell+13;x.fillStyle='#a06b00';x.fillRect(qx-9,qy-9,18,18);x.fillStyle='#ffd83e';x.fillRect(qx-7,qy-7,14,14);x.fillStyle='#fff1a0';x.fillRect(qx-2,qy-6,4,12)}enemies.forEach(e=>{let ex=e.x*cell+13,ey=e.y*cell+13;x.fillStyle='#9c1930';x.fillRect(ex-10,ey-10,20,20);x.fillStyle='#fff';x.fillRect(ex-7,ey-5,5,5);x.fillRect(ex+2,ey-5,5,5);x.fillStyle='#111';x.fillRect(ex-5,ey-3,2,2);x.fillRect(ex+4,ey-3,2,2);x.fillStyle='#fff0d5';x.fillRect(ex-6,ey+5,4,5);x.fillRect(ex+2,ey+5,4,5)});let co=skins[skin];snake.forEach((s,i)=>{let sx=s.x*cell,sy=s.y*cell;x.fillStyle=i?co[1]:co[0];x.fillRect(sx+2,sy+2,23,23);if(i==0){x.fillStyle='#fff';x.fillRect(sx+6,sy+6,5,5);x.fillRect(sx+16,sy+6,5,5);x.fillStyle='#111';x.fillRect(sx+8,sy+8,2,2);x.fillRect(sx+18,sy+8,2,2);x.fillStyle=co[1];x.fillRect(sx+9,sy+18,9,2);if(dragons.includes(skin)){x.fillRect(sx+2,sy,5,5);x.fillRect(sx+20,sy,5,5);x.fillStyle='#fff2dc';x.fillRect(sx+5,sy+20,4,4);x.fillRect(sx+18,sy+20,4,4)}}})}function preview(k){let q=document.createElement('canvas');q.width=230;q.height=90;let z=q.getContext('2d'),co=skins[k];z.fillStyle='#071018';z.fillRect(0,0,230,90);for(let i=0;i<6;i++){z.fillStyle=i%2?co[1]:co[0];z.fillRect(78+i*21,57,19,19)}z.fillStyle=co[1];z.fillRect(30,28,52,52);z.fillStyle=co[0];z.fillRect(36,34,40,40);z.fillStyle='#fff';z.fillRect(40,42,9,9);z.fillRect(63,42,9,9);z.fillStyle='#111';z.fillRect(43,45,3,4);z.fillRect(66,45,3,4);z.fillStyle=co[1];z.fillRect(47,63,20,4);if(dragons.includes(k)){z.fillStyle=co[1];z.fillRect(36,13,10,18);z.fillRect(67,13,10,18);z.fillStyle='#fff2dc';z.fillRect(42,66,6,9);z.fillRect(63,66,6,9)}return q.toDataURL()}function shop(){let e=$('shop');e.innerHTML='';shopItems.forEach(([id,n,p])=>{let r=document.createElement('div');r.className='item';r.innerHTML='<img class="prev" src="'+preview(id)+'"><span>'+n+'<br>🪙 '+p+'</span><button class="buy">'+(owned.includes(id)?'Usar':'Comprar')+'</button>';r.querySelector('button').onclick=()=>{if(!owned.includes(id)){if(coins<p)return;coins-=p;owned.push(id);localStorage.csCoins=coins;localStorage.csOwned=JSON.stringify(owned)}skin=id;localStorage.csSkin=id;shop();ui();draw()};e.appendChild(r)})}function menus(){let e=$('snakeColors');e.innerHTML='';Object.entries(skins).filter(([k])=>!dragons.includes(k)).forEach(([k,v])=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span style="display:inline-block;width:18px;height:18px;background:'+v[1]+';vertical-align:middle"></span> '+k;b.onclick=()=>{skin=k;localStorage.csSkin=k;draw()};e.appendChild(b)});e=$('mapColors');e.innerHTML='';Object.entries(mapColors).forEach(([k,v])=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span style="display:inline-block;width:18px;height:18px;background:'+v+';vertical-align:middle"></span> '+k;b.onclick=()=>{mapColor=k;localStorage.csMap=k;draw()};e.appendChild(b)});e=$('maps');e.innerHTML='';maps.forEach(([id,n,p])=>{let b=document.createElement('button');b.className='choice';b.textContent=n+(p?' 🪙'+p:'');b.onclick=()=>{if(!ownedMaps.includes(id)){if(coins<p)return;coins-=p;ownedMaps.push(id);localStorage.csCoins=coins;localStorage.csMaps=JSON.stringify(ownedMaps)}map=id;localStorage.csMapType=id;ui();draw()};e.appendChild(b)})}function missions(){let e=$('missions');[['a','Coma 20 maçãs',20,100],['c','Pegue 10 moedas',10,150],['e','Derrote 3 inimigos',3,200],['p','Chegue à fase 10',10,300]].forEach(q=>{let d=document.createElement('div');d.style.padding='9px';d.textContent=q[1]+' — '+(Math.min(q[2],0))+'/'+q[2]+' — 🪙 '+q[3];e.appendChild(d)})}document.querySelectorAll('.sec>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));$('settings').onclick=()=>$('panel').classList.add('open');$('close').onclick=()=>$('panel').classList.remove('open');$('restart').onclick=reset;$('again').onclick=reset;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)beep()};let tx=0,ty=0;c.ontouchstart=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>12)next=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)}};document.onkeydown=e=>{let d={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];if(d)next=d};shop();menus();missions();reset()</script></body></html>
